<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אימות אימייל הצליח - Smart Neighbors</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0F172A;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* רקע זוהר מותאם לעיצוב האפליקציה */
        .glow-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                radial-gradient(circle at 100% 0%, rgba(255, 0, 128, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(0, 242, 255, 0.12) 0%, transparent 50%);
        }

        .card {
            background-color: rgba(30, 41, 59, 0.75);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(10px);
            z-index: 2;
            animation: fadeIn 0.8s ease-out;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff0080, #00f2ff);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 8px 20px rgba(0, 242, 255, 0.3);
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 12px 0;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 20px 0;
        }

        .success-badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 16px;
        }

        .footer-text {
            font-size: 13px;
            color: #64748b;
            margin: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        
        <span class="success-badge">האימות בוצע בהצלחה!</span>
        
        <h1>החשבון שלך אומת</h1>
        <p>
            כתובת האימייל שלך אושרה במערכת.<br>
            בקשת ההרשמה הועברה להמשך אישור של ועד הבית או מנהל המערכת.
        </p>

        <div class="divider"></div>

        <p class="footer-text">
            תוכל כעת לסגור חלון זה, לחזור לאפליקציה ולהתחבר עם הפרטים שלך.
        </p>
    </div>
</body>
</html>
